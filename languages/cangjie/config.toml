name = "Cangjie"
grammar = "cangjie"
# `cj.macrocall`: the expansion cjls writes (README, Expand macro); Zed matches a suffix with dots
# on the end of the file name
path_suffixes = ["cj", "cj.macrocall"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 4
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "/*", end = " */", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["_"]
