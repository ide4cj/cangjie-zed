ignore_merge_commits = true
ignore_fixup_commits = true

# `cog bump` on master (bump.yml): the version into extension.toml and Cargo.toml, the tag, then release.yml
tag_prefix = "v"
branch_whitelist = ["master"]
pre_bump_hooks = [
    "perl -pi -e 's/^version = \".*\"/version = \"{{version}}\"/' extension.toml Cargo.toml",
    "cargo update --workspace",
]
post_bump_hooks = [
    "git push",
    "git push origin v{{version}}",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "ide4cj"
repository = "cangjie-zed"
